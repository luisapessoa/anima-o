  // Lista de telas (7 telas) e configuração de playback — copiado verbatim
  // do OM_SCENES do pacote de design handoff, nenhum texto alterado.
  window.OM_SCENES="[{\"name\":\"Tela 1\",\"layout\":\"quote\",\"dur\":5.5,\"head\":[\"“Não quero assinar um carro\",\"porque a quilometragem\",\"vai me limitar.”\"],\"tail\":\"Quem te disse isso?\"},{\"name\":\"Tela 2\",\"layout\":\"outline\",\"dur\":6.5,\"body\":[\"Antes de concluir que o\",\"plano não será suficiente,\",\"existe uma pergunta\",\"importante:\"],\"tail\":[\"Você sabe quantos quilômetros\",\"realmente dirige por mês?\"]},{\"name\":\"Tela 3\",\"layout\":\"kbb\",\"dur\":7,\"body\":[\"Um levantamento da\",\"KBB Brasil mostrou que\",\"o brasileiro percorre, em\",\"média, cerca de 12.900\",\"km no primeiro ano de\",\"uso do carro.\"],\"hi\":[\"Isso representa\",\"aproximadamente\",\"1.075 km por mês.\"]},{\"name\":\"Tela 4\",\"layout\":\"panel\",\"dur\":8,\"body\":[\"Por isso, planos de 1.000 ou 1.500\",\"km mensais podem atender à\",\"rotina de muitos motoristas.\"],\"body2\":[\"Essas faixas não são escolhidas\",\"ao acaso:\"],\"hi\":[\"elas acompanham\",\"diferentes perfis de uso.\"]},{\"name\":\"Tela 5\",\"layout\":\"checklist\",\"dur\":7.5,\"head\":[\"Para encontrar a\",\"quilometragem ideal,\",\"considere:\"],\"items\":[[\"os trajetos para o trabalho;\"],[\"os compromissos da\",\"semana;\"],[\"os passeios aos finais\",\"de semana;\"],[\"as viagens mais frequentes;\"],[\"uma margem para\",\"deslocamentos extras.\"]]},{\"name\":\"Tela 6\",\"layout\":\"divider\",\"dur\":7.5,\"head\":\"E se você dirige mais?\",\"body\":[\"A solução não é deixar de\",\"assinar, mas escolher uma\",\"faixa de quilometragem\",\"compatível com a sua\",\"realidade.\"],\"body2\":[\"Caso o limite seja\",\"ultrapassado, as condições e\",\"eventuais valores adicionais\",\"seguem o contrato do plano.\"]},{\"name\":\"Tela 7\",\"layout\":\"closing\",\"dur\":5.5,\"head\":[\"A quilometragem não existe\",\"para limitar o uso do carro.\"],\"body\":[\"Ela existe para que o plano seja\",\"escolhido de acordo com a sua rotina!\"]}]";
  window.OM_PLAYBACK = '{"mode":"times","count":1}';

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estilo TCO — vídeo vertical 1</title>
<!-- background videos for Telas 1, 3, 6, 8 (black scenes) -->
<link rel="preload" as="video" type="video/mp4" href="assets/bg-1.mp4" fetchpriority="high" />
<script>
  [
    ['assets/bg-3.mp4', 4000],
    ['assets/bg-6.mp4', 15000],
    ['assets/bg-8.mp4', 25000],
  ].forEach(function (pair) {
    setTimeout(function () {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'video'; l.type = 'video/mp4';
      l.href = pair[0];
      document.head.appendChild(l);
    }, pair[1]);
  });
</script>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/urbanist-700.woff2" crossorigin="anonymous" />
<link rel="preload" as="image" type="image/png" href="assets/estilo/logo-white.png" fetchpriority="high" />
<style>
  /* Urbanist self-hosted — evita depender de fonts.googleapis.com em tempo de exportação. */
  @font-face { font-family: 'Urbanist'; font-style: normal; font-weight: 400; font-display: swap;
    src: url("assets/fonts/urbanist-400-ext.woff2") format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Urbanist'; font-style: normal; font-weight: 400; font-display: swap;
    src: url("assets/fonts/urbanist-400.woff2") format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Urbanist'; font-style: normal; font-weight: 700; font-display: swap;
    src: url("assets/fonts/urbanist-700-ext.woff2") format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Urbanist'; font-style: normal; font-weight: 700; font-display: swap;
    src: url("assets/fonts/urbanist-700.woff2") format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  html, body { margin: 0; padding: 0; background: #000000; height: 100%; }
  a { color: #173ded; }
  a:hover { color: #4b6bf5; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="react.production.min.js"></script>
<script src="react-dom.production.min.js"></script>

<script>
  // Lista de telas (8 telas) e configuração de playback — copiado verbatim
  // do OM_SCENES do pacote de design handoff, nenhum texto alterado.
  window.OM_SCENES = '[{"name":"Tela 1","dur":4,"desc":"Tela preta com pergunta sobre custo total do carro em caixa azul que sobe"},{"name":"Tela 2","dur":5.6,"desc":"Perguntas comuns sobre entrada e parcela, com nota de que sao so parte da decisao"},{"name":"Tela 3","dur":4.6,"desc":"Cartao azul explica o conceito de TCO"},{"name":"Tela 4","dur":6.2,"desc":"Lista dos itens que compoem o custo de aquisicao"},{"name":"Tela 5","dur":5.2,"desc":"Pills mostram os custos de uso e manutencao"},{"name":"Tela 6","dur":4.4,"desc":"Tela preta sobre o tempo dedicado a gestao do veiculo"},{"name":"Tela 7","dur":6.0,"desc":"Carro Virtus com blobs azuis e texto sobre comparar modalidades"},{"name":"Tela 8","dur":4.0,"desc":"Encerramento sobre perfil pessoal e escolha consciente"}]';
  window.OM_PLAYBACK = '{"mode":"times","count":1}';
</script>

<script src="animations-v3.compiled.js"></script>
<script src="scenesEstiloTco.compiled.js"></script>

<script>
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.CompositionStage,
      { width: 1080, height: 1920, scenes: window.OM_SCENES, playback: window.OM_PLAYBACK, bg: '#000000' },
      React.createElement(window.EstiloPiece, { cornerRadius: 40 })
    )
  );
</script>
</body>
</html>

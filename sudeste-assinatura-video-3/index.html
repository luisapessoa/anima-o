<!-- bg-1.mp4 is high-priority — needed the instant Tela 1 mounts, with zero
     runtime head start. The other clips (Telas 3, 4, 6, 7) each get several
     seconds of scene time before they're needed, so they're preloaded at
     fetchpriority="low": still queued early (so their head start isn't
     lost), but the browser won't let them compete with bg-1.mp4 for
     bandwidth/CPU during the critical opening seconds.
     A 2s-delayed-injection version of this was tried to test whether
     concurrent preload of the other four was the source of Tela 1's
     stutter, but it pushed Tela 3's own preload late enough to bring back
     the "doesn't start immediately when the scene begins" stutter Tela 3
     had years ago — a confirmed regression for an unconfirmed fix, so it's
     reverted back to static preloads for all of them. -->
<link rel="preload" as="video" type="video/mp4" href="assets/bg-1.mp4" fetchpriority="high" />
<link rel="preload" as="video" type="video/mp4" href="assets/bg-3.mp4" fetchpriority="low" />
<link rel="preload" as="video" type="video/mp4" href="assets/bg-4.mp4" fetchpriority="low" />
<link rel="preload" as="video" type="video/mp4" href="assets/bg-6.mp4" fetchpriority="low" />
<link rel="preload" as="video" type="video/mp4" href="assets/bg-9.mp4" fetchpriority="low" />
<!-- DM Sans self-hosted woff2 preloaded so Tela 1's text reveal never races
     the font load (font-display:swap would otherwise flash a fallback
     font first). -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/dm-sans-latin.woff2" crossorigin="anonymous" />
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/dm-sans-latin-ext.woff2" crossorigin="anonymous" />
<!-- Tela 1's logo needs this the instant it mounts too — without a
     preload it competes with bg-1.mp4 for the same early bandwidth. -->
<link rel="preload" as="image" type="image/png" href="assets/logo-white.png" fetchpriority="high" />

<!-- React / ReactDOM (mesmas versões usadas nos projetos anteriores). Os
     arquivos .jsx são pré-compilados para .compiled.js em vez de
     transpilados no navegador — o transpiler em si (@babel/standalone) pesa
     ~3MB para baixar e fazer parse, e ainda gasta CPU real transpilando JSX
     a cada carregamento de página; isso competia por banda/CPU bem na
     janela crítica dos primeiros segundos (lição aprendida no Vídeo 2). -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script>
  // Lista de telas (7 telas) e configuração de playback, consumidos por
  // scenes3.jsx / animations-v2.jsx. Copiado verbatim do OM_SCENES do
  // documento de referência — nenhum texto foi alterado.
  window.OM_SCENES="[{\"name\":\"Tela 1\",\"layout\":\"opening\",\"dur\":4.5,\"head\":[\"E se o seu carro\",\"acompanhasse\"],\"hi\":\"as suas fases?\"},{\"name\":\"Tela 2\",\"layout\":\"timeline\",\"dur\":7,\"title\":[\"Pensa na sua\",\"vida há dois anos.\"],\"items\":[{\"icon\":\"clock\",\"lines\":[\"Sua rotina era igual?\"]},{\"icon\":\"cal\",\"lines\":[\"Seus planos\",\"eram os mesmos?\"]},{\"icon\":\"car\",\"lines\":[\"O carro que fazia\",\"sentido naquela época\",\"ainda combina com o\",\"seu momento de hoje?\"]}]},{\"name\":\"Tela 3\",\"layout\":\"highlight\",\"dur\":6,\"hi\":[\"A verdade é que\",\"a vida muda rápido.\"],\"body\":[\"Mudam os trajetos, o\",\"trabalho, a família, os planos,\",\"as prioridades e até o tipo de\",\"carro que faz sentido para você.\"]},{\"name\":\"Tela 4\",\"layout\":\"linesplit\",\"dur\":7,\"title\":[\"**Hoje,** talvez um carro\",\"compacto resolva\",\"perfeitamente sua rotina.\"],\"lead\":\"Mas daqui a alguns meses,\",\"body\":[\"você pode precisar de mais\",\"espaço, mais conforto, mais\",\"porta-malas ou uma categoria\",\"diferente.\"]},{\"name\":\"Tela 5\",\"layout\":\"truckcard\",\"dur\":7,\"body\":[\"Quando você compra\",\"ou financia um carro, a\",\"escolha costuma te\",\"acompanhar **por anos.**\"],\"body2\":[\"E, muitas vezes, sua vida\",\"muda antes do contrato\",\"acabar ou antes daquele\",\"carro continuar fazendo\",\"sentido.\"]},{\"name\":\"Tela 6\",\"layout\":\"lineleft\",\"dur\":7,\"title\":[\"Na assinatura, essa\",\"relação pode ser\",\"mais flexível.\"],\"body\":[\"Você dirige um carro 0km\",\"por um período contratado\",\"e, ao final, pode avaliar uma\",\"nova opção mais alinhada\",\"com a sua fase atual.\"]},{\"name\":\"Tela 7\",\"layout\":\"tealcard\",\"dur\":8,\"title\":[\"O carro ideal não precisa\",\"ser o mesmo para todos\",\"os momentos da vida.\"],\"body\":[\"Se a sua rotina muda, a forma\",\"como você escolhe seu carro\",\"também pode mudar!\"]}]";
  window.OM_PLAYBACK = '{"mode":"times","count":1}';
  // videoBg:true — fundos de vídeo ligados por padrão nas Telas 1, 3, 4 e 6
  // (as telas de fundo preto — Tela 2/7 são teal e a Tela 5 é clara).
  window.TWEAK_DEFAULTS = { showLogo: true, videoBg: true, motionEditor: false };
</script>

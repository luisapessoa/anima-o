<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>noomi — Oferta Relâmpago | Peugeot 2008 Allure</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     noomi — Oferta Relâmpago
     Animação 1920 x 1080  (formato paisagem)
     Fonte: Outfit  •  Cores da arte original preservadas
     ========================================================= */
  :root{
    --blue:        #1b3ad1;   /* azul principal noomi        */
    --blue-bright: #2a55f0;   /* azul de destaque (OF / preço)*/
    --blue-deep:   #16309f;
    --red:         #c31a1a;   /* vermelho selos              */
    --red-deep:    #8f0f0f;
    --ink:         #14161c;   /* preto texto                 */
    --paper:       #f3f4f6;   /* card claro                  */
    --bg-1:        #e9eaec;
    --bg-2:        #cdced2;
    --stage-w: 1920px;
    --stage-h: 1080px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:#0c0d10;
    font-family:"Outfit", system-ui, sans-serif;
    display:grid;
    place-items:center;
    overflow:hidden;
  }

  /* Escala o palco 1920x1080 para caber em qualquer tela mantendo proporção */
  .viewport{
    width:100vw; height:100vh;
    display:grid; place-items:center;
  }
  .fit{
    width:var(--stage-w); height:var(--stage-h);
    transform-origin:center center;
    /* min() garante que caiba tanto por largura quanto por altura */
    transform:scale( min( calc(100vw / 1920), calc(100vh / 1080) ) );
  }

  /* ---------------- PALCO ---------------- */
  .stage{
    position:relative;
    width:var(--stage-w); height:var(--stage-h);
    background:
      radial-gradient(120% 100% at 30% 25%, #f2f3f5 0%, var(--bg-1) 42%, var(--bg-2) 100%);
    overflow:hidden;
    color:var(--ink);
  }
  /* textura sutil (grão) igual ao fundo original */
  .stage::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(rgba(0,0,0,.045) 1px, transparent 1px);
    background-size:3px 3px; mix-blend-mode:multiply; opacity:.5;
  }
  /* vinheta */
  .stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 260px rgba(0,0,0,.20);
  }

  /* flash do relâmpago sobre a cena toda */
  .flash{
    position:absolute; inset:0; z-index:60; pointer-events:none;
    background:#ffffff; opacity:0;
    animation:flash 9s ease-out infinite;
  }
  @keyframes flash{
    0%,100%{opacity:0}
    6.0%{opacity:0}
    6.6%{opacity:.85}
    7.2%{opacity:0}
    7.8%{opacity:.55}
    8.4%{opacity:0}
  }

  /* ===================== LAYOUT ===================== */
  .grid{
    position:relative; z-index:10;
    width:100%; height:100%;
    display:grid;
    grid-template-columns:1.02fr .98fr;
    align-items:center;
  }

  /* --------- COLUNA ESQUERDA : carro + selo --------- */
  .left{ position:relative; height:100%; }

  .logo{
    position:absolute; top:64px; left:96px;
    font-weight:800; font-size:52px; letter-spacing:.02em;
    color:var(--ink);
    opacity:0; animation:dropIn .8s cubic-bezier(.2,.8,.2,1) .2s forwards;
  }
  .logo b{ color:var(--ink); font-weight:900; }
  .logo .o{ color:var(--blue); }

  .car-wrap{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-46%);
    width:840px;
    opacity:0;
    animation:driveIn 1.1s cubic-bezier(.16,.84,.3,1) .55s forwards;
  }
  .car-wrap svg{ width:100%; height:auto; display:block;
    filter:drop-shadow(0 46px 34px rgba(0,0,0,.35)); }
  .car-photo{ display:none; width:100%; height:auto;
    filter:drop-shadow(0 46px 34px rgba(0,0,0,.35)); }
  .car-float.has-photo .car-photo{ display:block; }
  .car-float.has-photo svg{ display:none; }
  .car-float{ animation:float 5s ease-in-out infinite 1.8s; transform-origin:center; }

  /* selo vermelho circular */
  .seal{
    position:absolute; z-index:20;
    right:70px; bottom:150px;
    width:210px; height:210px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #e33 0%, var(--red) 46%, var(--red-deep) 100%);
    color:#fff; box-shadow:0 16px 30px rgba(120,0,0,.35), inset 0 0 0 6px rgba(255,255,255,.16);
    display:grid; place-items:center;
    opacity:0; transform:scale(.2) rotate(-30deg);
    animation:stamp .7s cubic-bezier(.2,1.4,.4,1) 2.15s forwards;
  }
  .seal .ring{ position:absolute; inset:12px; border-radius:50%;
    animation:spin 18s linear infinite; }
  .seal .ring text{ font-size:15.5px; font-weight:800; letter-spacing:.12em; fill:#fff; }
  .seal .x{ font-size:60px; font-weight:900; line-height:1; }

  /* --------- COLUNA DIREITA : textos --------- */
  .right{ padding:70px 96px 70px 20px; }

  .headline{ margin-bottom:26px; }
  .headline .l1,.headline .l2{
    font-weight:900; line-height:.9; letter-spacing:-.01em;
    text-transform:uppercase;
  }
  .headline .l1{ font-size:150px; }
  .headline .l2{ font-size:150px; }
  .headline .of{ color:var(--blue); }
  .headline .erta{ color:var(--ink); }
  .headline .rel{ color:var(--ink); }

  .word{ display:inline-block; opacity:0; transform:translateX(-40px);
    animation:slideX .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .headline .l1 .word{ animation-delay:.9s; }
  .headline .l2 .word{ animation-delay:1.15s; }

  /* tag azul CARRO POR ASSINATURA */
  .tag{
    display:inline-block; background:var(--blue); color:#fff;
    font-weight:800; font-size:34px; letter-spacing:.03em; text-transform:uppercase;
    padding:16px 34px; border-radius:14px; margin-bottom:22px;
    box-shadow:0 10px 22px rgba(27,58,209,.28);
    opacity:0; transform:translateY(18px);
    animation:rise .6s ease-out 1.5s forwards;
  }

  /* card claro */
  .card{
    background:linear-gradient(180deg,#ffffff,var(--paper));
    border-radius:26px; padding:40px 46px 44px;
    box-shadow:0 30px 60px rgba(20,22,28,.16), inset 0 0 0 1px rgba(0,0,0,.04);
    opacity:0; transform:translateY(40px);
    animation:rise .8s cubic-bezier(.2,.8,.2,1) 1.7s forwards;
    max-width:760px;
  }
  .model{ font-weight:800; font-size:66px; line-height:1; margin-bottom:20px; }
  .model .b{ color:var(--blue); }
  .model .k{ color:var(--ink); }

  .pill{
    display:inline-block; background:var(--red); color:#fff;
    font-weight:700; font-size:30px; padding:11px 26px; border-radius:999px;
    margin-bottom:26px;
    animation:pulseRed 2.2s ease-in-out infinite 2.6s;
  }

  .price{ font-weight:700; font-size:52px; color:var(--ink); margin-bottom:28px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .price .val{ font-weight:900; font-size:78px; color:var(--blue-bright); line-height:.9; }
  .price .val small{ font-weight:700; font-size:40px; color:var(--blue-bright); }

  .cta{
    display:block; width:100%; text-align:center;
    background:var(--blue); color:#fff; text-decoration:none;
    font-weight:600; font-size:38px; padding:22px; border-radius:16px;
    box-shadow:0 14px 28px rgba(27,58,209,.30);
    position:relative; overflow:hidden;
    animation:beat 2.4s ease-in-out infinite 3s;
  }
  /* brilho passando no botão */
  .cta::after{
    content:""; position:absolute; top:0; left:-60%; width:50%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg);
    animation:sheen 3.4s ease-in-out infinite 3.4s;
  }
  .disclaimer{
    text-align:center; margin-top:20px; font-style:italic;
    font-weight:500; font-size:26px; color:#33363e; opacity:.9;
  }

  /* ===================== KEYFRAMES ===================== */
  @keyframes dropIn{ from{opacity:0; transform:translateY(-34px)} to{opacity:1; transform:none} }
  @keyframes slideX{ to{opacity:1; transform:none} }
  @keyframes rise{ to{opacity:1; transform:none} }
  @keyframes driveIn{
    from{opacity:0; transform:translate(-50%,-46%) translateX(120px) scale(.94)}
    to{opacity:1; transform:translate(-50%,-46%)}
  }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  @keyframes stamp{
    0%{opacity:0; transform:scale(.2) rotate(-30deg)}
    70%{opacity:1; transform:scale(1.08) rotate(6deg)}
    100%{opacity:1; transform:scale(1) rotate(-8deg)}
  }
  @keyframes spin{ to{transform:rotate(360deg)} }
  @keyframes pulseRed{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  @keyframes beat{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.028)} }
  @keyframes sheen{ 0%{left:-60%} 55%,100%{left:130%} }

  /* respeita quem prefere menos movimento */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-iteration-count:1 !important}
    .flash{display:none}
  }
</style>
</head>
<body>
  <div class="viewport">
   <div class="fit">
    <div class="stage">
      <div class="flash"></div>

      <div class="grid">
        <!-- ESQUERDA : logo + carro + selo -->
        <div class="left">
          <div class="logo"><span class="o">n</span><b>o</b><span class="o">o</span><b>mi</b></div>

          <div class="car-wrap">
            <div class="car-float">
              <!-- Se existir assets/car.png (a foto real), ela aparece no lugar da ilustração automaticamente -->
              <img class="car-photo" src="assets/car.png" alt="Peugeot 2008 Allure"

                   onerror="this.remove()" />

              <svg viewBox="0 0 900 420" role="img" aria-label="Peugeot 2008 Allure">

                    <stop offset="0" stop-color="#eaf6ff"/>

                </defs>

                <!-- sombra no chão -->
                <ellipse cx="452" cy="392" rx="366" ry="24" fill="rgba(0,0,0,.28)"/>

                <!-- corpo SUV (teto alto e reto, arcos marcados) -->

                         C168 232 196 212 236 202
                         L260 176
                         C272 162 288 156 312 156
                         L560 156
                         C586 156 604 164 616 184
                         L646 232
                         L742 244
                         C806 252 844 272 852 300
                         L852 356
                         C852 364 846 368 838 368
                         L86 368
                         C78 368 72 364 72 356 Z"
                      fill="url(#body)"/>
                <!-- teto -->
                <path d="M266 176 C278 164 292 160 312 160 L556 160 C580 160 596 168 606 186
                         L620 210 L286 210 Z" fill="#4a4e55"/>
                <!-- rack de teto -->
                <rect x="300" y="150" width="250" height="7" rx="3" fill="#33363c"/>

                <path d="M150 300 L830 300" stroke="rgba(255,255,255,.10)" stroke-width="3" fill="none"/>
                <!-- vinco lateral -->
                <path d="M120 330 L820 322" stroke="rgba(0,0,0,.18)" stroke-width="3" fill="none"/>

                <!-- vidros (janelas altas de SUV) -->
                <path d="M292 186 L556 186 C574 186 588 192 596 206 L610 226 L286 226 Z"

                <!-- montante central -->
                <rect x="430" y="188" width="12" height="40" fill="#2c3238" opacity=".6"/>
                <!-- retrovisor -->
                <path d="M270 214 l-24 4 l0 12 l24 -2 Z" fill="#3a3d43"/>

                <!-- faróis / DRL estilo garra -->
                <path d="M74 288 L120 282 L120 300 L74 304 Z" fill="url(#light)"/>
                <path d="M82 312 l34 -4 l0 8 l-34 5 Z" fill="#e9eef3" opacity=".85"/>

                <!-- maçanetas -->
                <rect x="352" y="256" width="44" height="8" rx="4" fill="rgba(0,0,0,.35)"/>
                <rect x="470" y="256" width="44" height="8" rx="4" fill="rgba(0,0,0,.35)"/>

                <!-- arcos de roda -->
                <path d="M186 368 a76 76 0 0 1 152 0 Z" fill="#26282c"/>

                <!-- rodas -->
                <g>
                  <circle cx="262" cy="356" r="70" fill="#16181b"/>
                  <circle cx="262" cy="356" r="42" fill="url(#rim)"/>
                  <circle cx="262" cy="356" r="10" fill="#0e0f11"/>
                  <g stroke="#2a2c30" stroke-width="6">
                    <line x1="262" y1="356" x2="262" y2="316"/><line x1="262" y1="356" x2="298" y2="374"/>
                    <line x1="262" y1="356" x2="226" y2="374"/><line x1="262" y1="356" x2="298" y2="336"/>
                    <line x1="262" y1="356" x2="226" y2="336"/>
                  </g>
                </g>
                <g>
                  <circle cx="672" cy="356" r="70" fill="#16181b"/>
                  <circle cx="672" cy="356" r="42" fill="url(#rim)"/>
                  <circle cx="672" cy="356" r="10" fill="#0e0f11"/>
                  <g stroke="#2a2c30" stroke-width="6">
                    <line x1="672" y1="356" x2="672" y2="316"/><line x1="672" y1="356" x2="708" y2="374"/>
                    <line x1="672" y1="356" x2="636" y2="374"/><line x1="672" y1="356" x2="708" y2="336"/>
                    <line x1="672" y1="356" x2="636" y2="336"/>
                  </g>
                </g>

                <!-- placa 2008 -->
                <rect x="150" y="316" width="72" height="26" rx="4" fill="#eef0f2"/>
                <text x="186" y="335" text-anchor="middle" font-family="Outfit" font-weight="800"
                      font-size="17" fill="#3a3d43">2008</text>
              </svg>
            </div>
          </div>

          <!-- selo NÃO ATENDEMOS APP DE MOBILIDADE -->
          <div class="seal">
            <svg class="ring" viewBox="0 0 210 210" width="210" height="210">
              <defs><path id="cpath" d="M105,105 m-84,0 a84,84 0 1,1 168,0 a84,84 0 1,1 -168,0"/></defs>
              <text><textPath href="#cpath" startOffset="0%">NÃO ATENDEMOS • APP DE MOBILIDADE • </textPath></text>
            </svg>
            <span class="x">✕</span>
          </div>
        </div>

        <!-- DIREITA : textos -->
        <div class="right">
          <div class="headline">
            <div class="l1"><span class="word"><span class="of">OF</span><span class="erta">ERTA</span></span></div>
            <div class="l2"><span class="word rel">RELÂMPAGO</span></div>
          </div>

          <span class="tag">Carro por assinatura</span>

          <div class="card">
            <div class="model"><span class="b">Peugeot</span> <span class="k">2008 Allure</span></div>
            <span class="pill">Últimas unidades</span>
            <div class="price">
              <span>A partir de</span>
              <span class="val">2.685,00<small>/mês</small></span>
            </div>
            <a class="cta" href="#">Oferta para CNPJ</a>

      </div>

  </div>
</body>
